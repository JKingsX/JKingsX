  <text x="350.0" y="21.5" text-anchor="middle" class="ttl">neofetch</text>
  <text class="k big ln" style="animation-delay:0.00s" x="28" y="68.0">jkings@github</text>
  <text class="dim ln" style="animation-delay:0.07s" x="28" y="88.0">-------------</text>
  <text class="ln" style="animation-delay:0.14s" x="28" y="116.3" xml:space="preserve"><tspan class="k">Name      </tspan><tspan class="v">Joao (JKings) Reis</tspan></text>
  <text class="ln" style="animation-delay:0.21s" x="28" y="140.6" xml:space="preserve"><tspan class="k">Now       </tspan><tspan class="v">Head of CRO &amp; Infrastructure</tspan></text>
  <text class="ln" style="animation-delay:0.28s" x="28" y="164.9" xml:space="preserve"><tspan class="k">Company   </tspan><tspan class="v">Unfair Advantage</tspan></text>
  <text class="ln" style="animation-delay:0.35s" x="28" y="189.1" xml:space="preserve"><tspan class="k">Stack     </tspan><tspan class="v">Python - TypeScript - Node - SQL</tspan></text>
  <text class="ln" style="animation-delay:0.42s" x="28" y="213.4" xml:space="preserve"><tspan class="k">Tools     </tspan><tspan class="v">Claude Code - ffmpeg - Meta Ads API</tspan></text>
  <text class="ln" style="animation-delay:0.49s" x="28" y="237.7" xml:space="preserve"><tspan class="k">Data      </tspan><tspan class="v">BigQuery - GA4 - Shopify - Yampi</tspan></text>
  <text class="ln" style="animation-delay:0.56s" x="28" y="262.0" xml:space="preserve"><tspan class="k">Editor    </tspan><tspan class="v">VS Code - PowerShell - Git</tspan></text>
  <text class="ln" style="animation-delay:0.63s" x="28" y="286.3" xml:space="preserve"><tspan class="k">Edu       </tspan><tspan class="v">Universidade do Sul de Santa Catarina</tspan></text>
  <text class="ln" style="animation-delay:0.70s" x="28" y="310.6" xml:space="preserve"><tspan class="k">Location  </tspan><tspan class="v">Florianopolis, SC - Brazil (UTC-3)</tspan></text>
  <text class="acc ln" style="animation-delay:0.77s" x="28" y="344.9">Skills</text>
  <text class="ln" style="animation-delay:0.84s" x="28" y="365.1" xml:space="preserve"><tspan class="k">  # </tspan><tspan class="v">Paid traffic - Funnel optimization - Data analysis</tspan></text>
  <text class="ln" style="animation-delay:0.91s" x="28" y="387.4" xml:space="preserve"><tspan class="k">  # </tspan><tspan class="v">Process automation - Systems engineering - Web design</tspan></text>
  <text class="ln" style="animation-delay:0.98s" x="28" y="409.7" xml:space="preserve"><tspan class="k">  # </tspan><tspan class="v">Infrastructure - Information technology</tspan></text>
  <text class="acc ln" style="animation-delay:1.05s" x="28" y="442.0">Highlights</text>
  <text class="ln" style="animation-delay:1.12s" x="28" y="462.3" xml:space="preserve"><tspan class="k">  * </tspan><tspan class="v">Ships growth infrastructure, not one-off experiments</tspan></text>
  <text class="ln" style="animation-delay:1.19s" x="28" y="484.6" xml:space="preserve"><tspan class="k">  * </tspan><tspan class="v">Turns funnel data into decisions that move revenue</tspan></text>
  <text class="ln" style="animation-delay:1.26s" x="28" y="506.9" xml:space="preserve"><tspan class="k">  * </tspan><tspan class="v">Builds the tool before doing the task twice</tspan></text>
  <text class="dim ln" style="animation-delay:1.33s" x="28" y="535.1">Seeking wisdom. Building things.</text>
