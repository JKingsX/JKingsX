  <text class="ln" style="animation-delay:0.42s" x="28" y="242" xml:space="preserve"><tspan class="k">Tools     </tspan><tspan class="v">Claude Code - ffmpeg - Meta Ads API</tspan></text>
  <text class="ln" style="animation-delay:0.49s" x="28" y="272" xml:space="preserve"><tspan class="k">Data      </tspan><tspan class="v">BigQuery - GA4 - Shopify - Yampi</tspan></text>
  <text class="ln" style="animation-delay:0.56s" x="28" y="302" xml:space="preserve"><tspan class="k">Editor    </tspan><tspan class="v">VS Code - PowerShell - Git</tspan></text>
  <text class="ln" style="animation-delay:0.63s" x="28" y="332" xml:space="preserve"><tspan class="k">Location  </tspan><tspan class="v">Brazil / UTC-3</tspan></text>
  <text class="acc ln" style="animation-delay:0.70s" x="28" y="372">Highlights</text>
  <text class="ln" style="animation-delay:0.77s" x="28" y="398" xml:space="preserve"><tspan class="k">  * </tspan><tspan class="v">Ships marketing pipelines that run themselves</tspan></text>
  <text class="ln" style="animation-delay:0.84s" x="28" y="426" xml:space="preserve"><tspan class="k">  * </tspan><tspan class="v">Turns DRE spreadsheets into decisions</tspan></text>
  <text class="ln" style="animation-delay:0.91s" x="28" y="454" xml:space="preserve"><tspan class="k">  * </tspan><tspan class="v">Builds the tool before doing the task twice</tspan></text>
