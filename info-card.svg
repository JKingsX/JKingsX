<svg xmlns="http://www.w3.org/2000/svg" width="700" height="660" viewBox="0 0 700 660" role="img" aria-label="neofetch-style info card">
  <title>jkings@github</title>
  <style>
    text { font-family: 'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; font-size: 17px; fill: #c9d1d9; }
    .k { fill: #39d353; }
    .v { fill: #c9d1d9; }
    .dim { fill: #8b949e; }
    .acc { fill: #58a6ff; font-weight: 600; }
    .big { font-size: 21px; font-weight: 700; }
    .ttl { fill: #8b949e; font-size: 13px; }
    @keyframes ln { from { opacity: 0; transform: translateY(6px); }
                    to   { opacity: 1; transform: translateY(0); } }
    .ln { opacity: 0; animation: ln 0.45s ease-out forwards; }
  
