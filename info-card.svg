  <text x="350.0" y="21.5" text-anchor="middle" class="ttl">neofetch</text>
  <text class="k big ln" style="animation-delay:0.00s" x="28" y="68.0">jkings@github</text>
  <text class="dim ln" style="animation-delay:0.07s" x="28" y="88.0">-------------</text>
  <text class="ln" style="animation-delay:0.14s" x="28" y="122.0" xml:space="preserve"><tspan class="k">Name      </tspan><tspan class="v">Joao (JKings) Reis</tspan></text>
  <text class="ln" style="animation-delay:0.21s" x="28" y="152.0" xml:space="preserve"><tspan class="k">Now       </tspan><tspan class="v">Head of CRO &amp; Infrastructure</tspan></text>
  <text class="ln" style="animation-delay:0.28s" x="28" y="182.0" xml:space="preserve"><tspan class="k">Company   </tspan><tspan class="v">Unfair Advantage</tspan></text>
  <text class="ln" style="animation-delay:0.35s" x="28" y="212.0" xml:space="preserve"><tspan class="k">Growth    </tspan><tspan class="v">Paid traffic - Funnel optimization</tspan></text>
  <text class="ln" style="animation-delay:0.42s" x="28" y="242.0" xml:space="preserve"><tspan class="k">Data      </tspan><tspan class="v">Data analysis</tspan></text>
  <text class="ln" style="animation-delay:0.49s" x="28" y="272.0" xml:space="preserve"><tspan class="k">Systems   </tspan><tspan class="v">Systems engineering - Infrastructure</tspan></text>
  <text class="ln" style="animation-delay:0.56s" x="28" y="302.0" xml:space="preserve"><tspan class="k">Ops       </tspan><tspan class="v">Process automation - IT</tspan></text>
  <text class="ln" style="animation-delay:0.63s" x="28" y="332.0" xml:space="preserve"><tspan class="k">Design    </tspan><tspan class="v">Web design</tspan></text>
  <text class="ln" style="animation-delay:0.70s" x="28" y="362.0" xml:space="preserve"><tspan class="k">Edu       </tspan><tspan class="v">Universidade do Sul de Santa Catarina</tspan></text>
  <text class="ln" style="animation-delay:0.77s" x="28" y="392.0" xml:space="preserve"><tspan class="k">Location  </tspan><tspan class="v">Florianopolis, SC - Brazil (UTC-3)</tspan></text>
  <text class="acc ln" style="animation-delay:0.84s" x="28" y="432.0">Highlights</text>
  <text class="ln" style="animation-delay:0.91s" x="28" y="458.0" xml:space="preserve"><tspan class="k">  * </tspan><tspan class="v">Owns the funnel end to end: traffic in, conversion out</tspan></text>
  <text class="ln" style="animation-delay:0.98s" x="28" y="486.0" xml:space="preserve"><tspan class="k">  * </tspan><tspan class="v">Builds the infrastructure the growth work runs on</tspan></text>
  <text class="ln" style="animation-delay:1.05s" x="28" y="514.0" xml:space="preserve"><tspan class="k">  * </tspan><tspan class="v">Automates the process before scaling the team</tspan></text>
  <text class="dim ln" style="animation-delay:1.12s" x="28" y="548.0">Seeking wisdom. Building things.</text>
